<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">HMS</div>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <div class="topbar-left">
          <button class="back-btn" onclick="history.back()" aria-label="Go back">←</button>
          <h1>Dashboard</h1>
        </div>
        <div class="user-chip">
          <span id="user-chip-text">Loading...</span>
          <button class="btn-secondary" id="logout-btn">Logout</button>
        </div>
      </div>
      <p style="color:#718096;">More widgets (appointment counts, revenue) will appear here as those modules mature.</p>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => initLayout("index.html"));</script>
</body>
</html>
