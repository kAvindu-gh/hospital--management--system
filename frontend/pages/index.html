<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - HMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">HMS</div>
      <nav>
        <a href="index.html" class="active">Dashboard</a>
        <a href="patients.html">Patients</a>
      </nav>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <h1>Dashboard</h1>
        <div class="user-chip">
          <span id="user-chip-text">Loading...</span>
          <button class="btn-secondary" onclick="handleLogout()">Logout</button>
        </div>
      </div>
      <p style="color:#718096;">More widgets (appointments, revenue) will appear here as those modules are built.</p>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (async function () {
      if (!getToken()) { window.location.href = "login.html"; return; }
      const response = await apiFetch("/auth/me");
      if (!response.ok) { clearToken(); window.location.href = "login.html"; return; }
      const user = await response.json();
      document.getElementById("user-chip-text").textContent = `${user.username} (${user.role})`;
    })();
  </script>
</body>
</html>
