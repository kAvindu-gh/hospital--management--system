<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments - HMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">HMS</div>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <div class="topbar-left">
          <button class="back-btn" onclick="history.back()" aria-label="Go back">←</button>
          <h1>Appointments</h1>
        </div>
        <div class="user-chip">
          <span id="user-chip-text">Loading...</span>
          <button class="btn-secondary" id="logout-btn">Logout</button>
        </div>
      </div>

      <div class="toolbar">
        <select id="status-filter" class="search-input" style="max-width: 200px;">
          <option value="">All statuses</option>
          <option value="scheduled">Scheduled</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="btn-primary" style="width: auto; margin-top: 0;" onclick="openBookingModal()">+ Book Appointment</button>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead><tr><th>Patient</th><th>Doctor</th><th>Date & Time</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="appointments-tbody"><tr><td colspan="6" class="empty-state">Loading appointments...</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="booking-modal">
    <div class="modal-box">
      <h2>Book Appointment</h2>
      <form id="booking-form">
        <div class="field"><label for="patient_id">Patient</label><select id="patient_id" required></select></div>
        <div class="field"><label for="doctor_id">Doctor</label><select id="doctor_id" required></select></div>
        <div class="field"><label for="appointment_date">Date & Time</label><input type="datetime-local" id="appointment_date" required></div>
        <div class="field"><label for="reason">Reason</label><input type="text" id="reason"></div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Book</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/appointments.js"></script>
</body>
</html>
