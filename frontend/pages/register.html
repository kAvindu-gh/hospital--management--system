<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - HMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-card">
    <h1>Create Account</h1>
    <div class="error-message" id="error-message"></div>
    <form id="register-form">
      <div class="field"><label for="username">Username</label><input type="text" id="username" required></div>
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
      <div class="field">
        <label for="role">Role</label>
        <select id="role" required>
          <option value="doctor">Doctor</option>
          <option value="receptionist">Receptionist</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Register</button>
    </form>
    <div class="switch-link">Already have an account? <a href="login.html">Login</a></div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>document.getElementById("register-form").addEventListener("submit", handleRegister);</script>
</body>
</html>
