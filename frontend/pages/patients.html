<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients - HMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">HMS</div>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main class="main-content">
      <div class="topbar">
      <div class="topbar-left">
        <button class="back-btn" onclick="history.back()" aria-label="Go back">←</button>
        <h1>Patients</h1>
      </div>
        <div class="user-chip">
          <span id="user-chip-text">Loading...</span>
          <button class="btn-secondary" id="logout-btn">Logout</button>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="search-box" class="search-input" placeholder="Search patients by name...">
        <button class="btn-primary" style="width: auto; margin-top: 0;" onclick="openAddModal()">+ Add Patient</button>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Date of Birth</th><th>Gender</th><th>Phone</th><th>Address</th><th>Actions</th></tr>
          </thead>
          <tbody id="patients-tbody">
            <tr><td colspan="6" class="empty-state">Loading patients...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="patient-modal">
    <div class="modal-box">
      <h2 id="modal-title">Add Patient</h2>
      <form id="patient-form">
        <div class="field"><label for="full_name">Full Name</label><input type="text" id="full_name" required></div>
        <div class="field"><label for="date_of_birth">Date of Birth</label><input type="date" id="date_of_birth"></div>
        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field"><label for="phone">Phone</label><input type="text" id="phone"></div>
        <div class="field"><label for="address">Address</label><input type="text" id="address"></div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="view-modal">
    <div class="modal-box">
      <h2>Patient Details</h2>
      <div id="view-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="closeViewModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/patients.js"></script>
</body>
</html>
